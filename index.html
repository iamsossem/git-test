<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Scroll Interaction</title>

  <!-- Material Design 3 기본 서체: Roboto + 한글 Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- [효과 3] 상단 스크롤 진행률: M3 Linear progress indicator -->
  <div class="progress-bar" id="progressBar" role="progressbar" aria-label="스크롤 진행률"></div>

  <!-- M3 Small top app bar -->
  <header class="top-app-bar" id="topAppBar">
    <span class="md-title-large">Slow Down</span>
    <a class="md-button md-button--text md-label-large" href="#mountain">시작하기</a>
  </header>

  <!-- 히어로 섹션 -->
  <section class="hero">
    <!-- [효과 2] 패럴랙스 배경 이미지 -->
    <div class="hero-bg" id="heroBg"
         style="background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80');"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <h1 class="md-display-large fade-up">깃허브에서 수정</h1>
      <p class="md-body-large fade-up">잠시 멈추고 천천히 내려가 보세요.<br>스크롤에 따라 풍경이 이어집니다.</p>
      <a class="md-button md-button--filled md-label-large fade-up" href="#mountain">
        <svg class="md-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16.5 5.5 10l1.4-1.4 5.1 5.1 5.1-5.1 1.4 1.4z"/></svg>
        둘러보기
      </a>
    </div>
  </section>

  <!-- 섹션 1 -->
  <section class="section" id="mountain">
    <div class="section-text">
      <span class="md-chip md-label-large fade-up">01 · 산</span>
      <h2 class="md-headline-large fade-up">Mountain</h2>
      <p class="md-body-large fade-up">높은 곳에서 바라보면 모든 것이 단순해집니다.<br>복잡한 생각은 잠시 내려놓아도 괜찮습니다.</p>
    </div>
    <div class="section-image fade-up">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80" alt="구름 위로 솟은 산봉우리" loading="lazy">
    </div>
  </section>

  <!-- 섹션 2 -->
  <section class="section reverse">
    <div class="section-text">
      <span class="md-chip md-label-large fade-up">02 · 숲</span>
      <h2 class="md-headline-large fade-up">Forest</h2>
      <p class="md-body-large fade-up">나무 사이로 스며드는 빛처럼<br>작은 여백이 하루를 채워줍니다.</p>
    </div>
    <div class="section-image fade-up">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="햇살이 비치는 숲길" loading="lazy">
    </div>
  </section>

  <!-- 섹션 3 -->
  <section class="section">
    <div class="section-text">
      <span class="md-chip md-label-large fade-up">03 · 호수</span>
      <h2 class="md-headline-large fade-up">Lake</h2>
      <p class="md-body-large fade-up">고요한 물결 위에 하늘이 담깁니다.<br>오늘의 끝도 이렇게 잔잔하기를.</p>
    </div>
    <div class="section-image fade-up">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80" alt="산에 둘러싸인 잔잔한 호수" loading="lazy">
    </div>
  </section>

  <footer class="footer md-body-large">Slow Down · Photos from Unsplash</footer>

  <script src="script.js"></script>
</body>
</html>
