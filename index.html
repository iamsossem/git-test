<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Interaction</title>

    <!-- Pretendard 폰트 (CDN) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- [효과 3] 상단 스크롤 진행률 프로그래스 바 -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- 히어로 섹션 -->
    <section class="hero">
      <!-- [효과 2] 패럴랙스 배경 이미지 -->
      <div
        class="hero-bg"
        id="heroBg"
        style="
          background-image: url(&quot;https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80&quot;);
        "
      ></div>
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1 class="fade-up">Slow Down</h1>
        <p class="fade-up">
          잠시 멈추고 천천히 내려가 보세요.<br />스크롤에 따라 풍경이
          이어집니다.
        </p>
      </div>
    </section>

    <!-- 섹션 1 -->
    <section class="section">
      <div class="section-text">
        <h2 class="fade-up">Mountain</h2>
        <p class="fade-up">
          높은 곳에서 바라보면 모든 것이 단순해집니다.<br />복잡한 생각은 잠시
          내려놓아도 괜찮습니다.
        </p>
      </div>
      <div class="section-image fade-up">
        <img
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80"
          alt="구름 위로 솟은 산봉우리"
          loading="lazy"
        />
      </div>
    </section>

    <!-- 섹션 2 -->
    <section class="section reverse">
      <div class="section-text">
        <h2 class="fade-up">Forest</h2>
        <p class="fade-up">
          나무 사이로 스며드는 빛처럼<br />작은 여백이 하루를 채워줍니다.
        </p>
      </div>
      <div class="section-image fade-up">
        <img
          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80"
          alt="햇살이 비치는 숲길"
          loading="lazy"
        />
      </div>
    </section>

    <!-- 섹션 3 -->
    <section class="section">
      <div class="section-text">
        <h2 class="fade-up">Lake</h2>
        <p class="fade-up">
          고요한 물결 위에 하늘이 담깁니다.<br />오늘의 끝도 이렇게 잔잔하기를.
        </p>
      </div>
      <div class="section-image fade-up">
        <img
          src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
          alt="산에 둘러싸인 잔잔한 호수"
          loading="lazy"
        />
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
